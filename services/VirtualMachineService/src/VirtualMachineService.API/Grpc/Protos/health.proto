syntax = "proto3";

package grpc.health.v1;
option csharp_namespace = "Grpc.Health.V1";

// Standard gRPC health-check contract — implemented by
// Grpc.AspNetCore.HealthChecks via MapGrpcHealthChecksService().
// Not compiled here; kept as the checked-in contract reference.

service Health {
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
  rpc Watch (HealthCheckRequest) returns (stream HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN     = 0;
    SERVING     = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
