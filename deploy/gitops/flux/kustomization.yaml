# Flux — GitRepository + Kustomization for the platform.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cleanarch-platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/yourorg/cleanarch.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cleanarch-platform
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/gitops/manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: cleanarch-platform
  validation: client
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cleanarch-api
      namespace: cleanarch
