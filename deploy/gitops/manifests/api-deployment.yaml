# Synced by ArgoCD/Flux — the API's k8s presence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanarch-api
  namespace: cleanarch
  labels:
    app: cleanarch-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cleanarch-api
  template:
    metadata:
      labels:
        app: cleanarch-api
    spec:
      containers:
        - name: api
          image: registry.yourplatform.dev/cleanarch/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: CloudProvider
              value: BareMetal
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cleanarch-api
  namespace: cleanarch
spec:
  selector:
    app: cleanarch-api
  ports:
    - port: 80
      targetPort: 8080
